[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aron-mt5-demo-trader"
version = "0.1.0"
description = "Offline research and backtesting foundation for an Aron MT5 demo workflow"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "numpy>=1.26,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
