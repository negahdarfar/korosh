name: ARON Demo Trader - tests
on:
  push:
    paths:
      - 'projects/aron-mt5-demo-trader/**'
      - '.github/workflows/aron-mt5-demo-trader.yml'
  pull_request:
    paths:
      - 'projects/aron-mt5-demo-trader/**'
      - '.github/workflows/aron-mt5-demo-trader.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/aron-mt5-demo-trader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: pytest -q
